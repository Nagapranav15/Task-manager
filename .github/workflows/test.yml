name: Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Jest & MongoMemoryServer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        env:
          JWT_SECRET: your_jwt_secret_key
        run: |
          cd backend
          npm test

  frontend-tests:
    name: Frontend Test Suite (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/Task-manager/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/Task-manager
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend/Task-manager
          npm test
